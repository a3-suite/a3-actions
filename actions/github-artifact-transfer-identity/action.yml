name: github-artifact-transfer-identity
description: Verify a GitHub Actions artifact identity through the read-only GitHub API.
inputs:
  github-token:
    required: true
    description: Read-only token used only for the GitHub API request.
  repository:
    required: true
    description: owner/name repository containing the artifact.
  run-id:
    required: true
    description: Expected workflow run ID.
  artifact-name:
    required: true
    description: Expected artifact name.
  artifact-id:
    required: true
    description: Expected artifact ID.
  artifact-digest:
    required: true
    description: 'Expected SHA-256 digest, with or without the sha256: prefix.'
outputs:
  status:
    description: success or failed.
  artifact-transfer-run-id:
    description: Verified workflow run ID.
  artifact-transfer-name:
    description: Verified artifact name.
  artifact-transfer-id:
    description: Verified artifact ID.
  artifact-transfer-digest:
    description: Verified normalized SHA-256 digest.
runs:
  using: node20
  main: dist/index.js
