version: 1
name: cli-option-vocabulary
options:
  - id: owner-skill-discovery
    long: --owner-skill-discovery
    kind: value
    value_name: PATH
    summary: Select an owner skill discovery DSL instance
  - id: workspace-root
    long: --workspace-root
    kind: value
    value_name: PATH
    summary: Workspace root used to resolve current SDD artifacts and owner definitions
  - id: format
    long: --format
    kind: value
    value_name: FORMAT
    summary: Diagnostic output format requested from the SDD runtime
    default: text
    allowed_values: [text, json]
