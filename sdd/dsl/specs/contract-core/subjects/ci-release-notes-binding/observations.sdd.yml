version: 1
name: contract-observations
subject_ref: subject.ci.release-notes-binding
observations:
  - id: observation.ci-release-notes-binding.outputs
    summary: The Action exposes validated release identity, body digest, and approval ID.
    boundary:
      ref: boundary.action-output
    value:
      root: action.outputs
      kind: object
      fields:
        - selector: status
          kind: observation_field
          meaning: Whether release-notes and approval binding succeeded.
        - selector: release-identity
          kind: observation_field
          meaning: Validated release identity.
        - selector: digest
          kind: observation_field
          meaning: SHA-256 digest of the release notes body.
        - selector: approval-id
          kind: observation_field
          meaning: Validated approval identifier.
