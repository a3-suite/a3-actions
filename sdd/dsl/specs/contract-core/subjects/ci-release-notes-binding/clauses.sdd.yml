version: 1
name: contract-clauses
subject_ref: subject.ci.release-notes-binding
contracts:
  - id: contract.ci-release-notes-binding.outputs
    summary: Matching release notes and approval inputs produce a release-notes status output.
    conditions:
      - id: notes-input-present
        input_predicate:
          kind: input
          term: input.handoff-json
          op: present
    guarantees:
      - id: release-notes-binding-status-produced
        when: notes-input-present
        observation_ref: observation.ci-release-notes-binding.outputs
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: status
    verification_intents:
      - id: release-notes-binding-output-set
        goal: Matching notes and approval inputs produce their status output.
        guarantee_refs:
          - release-notes-binding-status-produced
