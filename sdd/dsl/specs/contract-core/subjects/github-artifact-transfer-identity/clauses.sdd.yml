version: 1
name: contract-clauses
subject_ref: subject.ci.github-artifact-transfer-identity
contracts:
  - id: contract.ci.github-artifact-transfer-identity.outputs
    summary: Matching provider identity produces verified artifact outputs.
    conditions:
      - id: expected-identity-present
        input_predicate: {kind: input, term: input.artifact-id, op: present}
    guarantees:
      - id: artifact-identity-output-produced
        when: expected-identity-present
        observation_ref: observation.ci.github-artifact-transfer-identity.outputs
        claim: {kind: observable-result, op: present, target: {kind: observation_field, value: artifact-transfer-id}}
    verification_intents:
      - id: artifact-identity-output-set
        goal: A matching GitHub API response exposes the verified identity.
        guarantee_refs: [artifact-identity-output-produced]
