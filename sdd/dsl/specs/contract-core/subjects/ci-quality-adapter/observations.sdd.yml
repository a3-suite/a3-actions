version: 1
name: contract-observations
subject_ref: subject.ci.quality-adapter
observations:
  - id: observation.ci-quality-adapter.outputs
    summary: The Action exposes the aggregate adapter execution status.
    boundary:
      ref: boundary.action-output
    value:
      root: action.outputs
      kind: object
      fields:
        - selector: status
          kind: observation_field
          meaning: Aggregate quality adapter status.
        - selector: result-path
          kind: observation_field
          meaning: Path to the quality adapter result JSON, set only when the adapter result is written; absent when descriptor loading or execution initialization is rejected.
  - id: observation.ci-quality-adapter.result
    summary: The Action exposes non-success step outcomes and toolchain mismatch diagnostics.
    boundary:
      ref: boundary.action-output
    value:
      root: action.step-result
      kind: object
      fields:
        - selector: outcome
          kind: observation_field
          meaning: Failure outcome of a rejected or non-success quality adapter step, including toolchain version mismatch.
