version: 1
name: contract-clauses
subject_ref: subject.repository.action-distribution
contracts:
  - id: contract.repository-action-distribution.integrity
    summary: Repository gates derive distribution work and catalog projection from maintained Action sources and reject untracked distribution state.
    conditions:
      - id: distribution-inputs-available
        environment_predicate:
          kind: environment-ref
          target_ref: runtime-context.repository-action-distribution-inputs-available
          op: available
      - id: distribution-inconsistent
        environment_predicate:
          kind: environment-ref
          target_ref: runtime-context.repository-action-distribution-inconsistent
          op: available
      - id: catalog-inputs-available
        environment_predicate:
          kind: environment-ref
          target_ref: runtime-context.repository-action-catalog-inputs-available
          op: available
    guarantees:
      - id: distribution-plan-produced
        when: distribution-inputs-available
        observation_ref: observation.repository-action-distribution.gate-result
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: distribution
      - id: inconsistent-distribution-rejected
        when: distribution-inconsistent
        observation_ref: observation.repository-action-distribution.gate-result
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: distribution
            right:
              kind: value_set
              values:
                - failure
      - id: action-catalog-projected
        when: catalog-inputs-available
        observation_ref: observation.repository-action-distribution.gate-result
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: catalog
    verification_intents:
      - id: distribution-plan-derived
        goal: Maintained Action and script bundles produce a complete distribution rebuild and comparison plan.
        guarantee_refs:
          - distribution-plan-produced
      - id: inconsistent-distribution-stopped
        goal: Untracked distribution files and untracked Composite Action script references stop the gate.
        guarantee_refs:
          - inconsistent-distribution-rejected
      - id: action-catalog-derived
        goal: The catalog projection adds and removes discovered Actions while preserving curated usage text.
        guarantee_refs:
          - action-catalog-projected
