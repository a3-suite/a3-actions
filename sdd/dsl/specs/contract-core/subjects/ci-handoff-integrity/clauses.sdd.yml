version: 1
name: contract-clauses
subject_ref: subject.ci.handoff-integrity
contracts:
  - id: contract.ci-handoff-integrity.outputs
    summary: A matching handoff descriptor and manifest produce a handoff status output.
    conditions:
      - id: handoff-input-present
        input_predicate:
          kind: input
          term: input.handoff-root
          op: present
    guarantees:
      - id: handoff-status-produced
        when: handoff-input-present
        observation_ref: observation.ci-handoff-integrity.outputs
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: status
    verification_intents:
      - id: handoff-output-set
        goal: A valid handoff produces its status output.
        guarantee_refs:
          - handoff-status-produced
